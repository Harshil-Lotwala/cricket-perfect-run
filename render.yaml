services:
  - type: web
    name: perfect-run-api
    runtime: docker
    plan: starter
    rootDir: backend/backend
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LEADERBOARD_FILE
        value: /var/data/leaderboard.json
    disk:
      name: leaderboard-data
      mountPath: /var/data
      sizeGB: 1
