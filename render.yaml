services:
  - type: web
    name: perfect-run-api
    runtime: docker
    plan: free
    rootDir: backend/backend
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
